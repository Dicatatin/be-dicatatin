openapi: 3.0.0

info:
  title: DICATAT.IN API
  version: 1.0.0
  description: API Documentation for Dicatat.in Backend (Laravel Sanctum Auth)

servers:
  - url: http://localhost:8000/api
    description: Local Development Server

components:
  securitySchemes:
    sanctumAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Gunakan token dari endpoint login Sanctum

security:
  - sanctumAuth: []

paths:

  /auth/register:
    post:
      tags:
        - Auth
      summary: Register a new user
      description: Create a new user account and return access token.

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
                - password
                - password_confirmation

              properties:
                name:
                  type: string
                  example: Faris Andi

                email:
                  type: string
                  format: email
                  example: faris@example.com

                password:
                  type: string
                  format: password
                  example: secret123

                password_confirmation:
                  type: string
                  format: password
                  example: secret123

      responses:
        '201':
          description: User successfully registered

        '422':
          description: Validation error

  /auth/login:
    post:
      tags:
        - Auth
      summary: Login user
      description: Authenticate user and return Sanctum token.

      security: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password

              properties:
                email:
                  type: string
                  format: email
                  example: faris@example.com

                password:
                  type: string
                  format: password
                  example: secret123

      responses:
        '200':
          description: Successfully authenticated

        '401':
          description: Invalid credentials

  /auth/logout:
    post:
      tags:
        - Auth
      summary: Logout user
      description: Revoke current access token.

      responses:
        '200':
          description: Successfully logged out

        '401':
          description: Unauthenticated

  /workspaces:
    get:
      tags:
        - Workspaces
      summary: Get All Workspaces
      description: Mengambil seluruh workspace milik user.

      responses:
        '200':
          description: Berhasil mengambil data
          content:
            application/json:
              example:
                success: true
                message: Data workspace berhasil diambil
                data:
                  - id: uuid-1234
                    name: Catatan Biologi
                    method: mind_map
                    createdAt: 2026-05-11T13:41:23.000000Z
                    updatedAt: 2026-05-11T13:41:23.000000Z
                errors: null

    post:
      tags:
        - Workspaces
      summary: Create New Workspace
      description: Upload gambar catatan untuk diproses AI secara background.

      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object

              properties:
                file:
                  type: string
                  format: binary

                method:
                  type: string
                  example: mind_map

                name:
                  type: string
                  example: Untitled

      responses:
        '202':
          description: AI processing started
          content:
            application/json:
              example:
                success: true
                message: Gambar diterima, AI sedang memproses...
                data:
                  id: uuid-1234
                  ai_status: processing
                errors: null

  /workspaces/{id}:
    get:
      tags:
        - Workspaces
      summary: Get Workspace Detail
      description: Endpoint polling untuk mendapatkan hasil AI.

      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string

      responses:
        '200':
          description: Success
          content:
            application/json:
              example:
                success: true
                message: Detail workspace diambil
                data:
                  id: uuid-1234
                  name: Catatan Biologi
                  method: mind_map
                  nodes: []
                  edges: []
                  flashcards: []
                  createdAt: 2026-05-11T13:41:23.000000Z
                  updatedAt: 2026-05-11T20:43:16.000000Z
                errors: null

    put:
      tags:
        - Workspaces
      summary: Update Workspace
      description: Auto-save perubahan workspace.

      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object

              properties:
                name:
                  type: string

                nodes:
                  type: array
                  items:
                    type: object

                edges:
                  type: array
                  items:
                    type: object

                flashcards:
                  type: array
                  items:
                    type: object

      responses:
        '200':
          description: Workspace berhasil disimpan
          content:
            application/json:
              example:
                success: true
                message: Workspace berhasil disimpan
                data:
                  updatedAt: 2026-05-11T21:00:00.000000Z
                errors: null

  /workspaces/{id}/transform:
    post:
      tags:
        - Workspaces
      summary: Transform Workspace Method
      description: Mengubah metode catatan dan memproses ulang AI.

      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object

              properties:
                new_method:
                  type: string
                  example: cornell

      responses:
        '202':
          description: Transform processing started
          content:
            application/json:
              example:
                success: true
                message: Transformasi sedang diproses...
                data:
                  id: uuid-1234
                  ai_status: processing
                errors: null