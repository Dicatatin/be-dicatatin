openapi: 3.0.0

info:
  title: DICATAT.IN API
  version: 1.0.0
  description: API Documentation for Dicatat.in Backend (Laravel Sanctum Auth)

servers:
  - url: https://be-dicatatin-production.up.railway.app/api
    description: Production Server (Railway)
  - url: http://localhost:8000/api
    description: Local Development Server

components:
  securitySchemes:
    sanctumAuth:
      type: http
      scheme: bearer
      description: Gunakan Bearer Token dari endpoint login

  schemas:
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Request berhasil
        data:
          type: object
          nullable: true
        errors:
          type: object
          nullable: true
          example: null

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: Terjadi kesalahan
        data:
          type: object
          nullable: true
          example: null
        errors:
          type: object
          nullable: true

    HeroSectionContent:
      type: object
      description: Konten teks Hero Section pada Landing Page.
      properties:
        title_prefix:
          type: string
          example: 'Ubah Catatan Berantakan Menjadi '
        title_highlight:
          type: string
          example: Pengetahuan Terstruktur
        title_suffix:
          type: string
          example: ' dalam Hitungan Detik'
        subtitle:
          type: string
          example: 'Platform AI yang memahami tulisan tanganmu. Pilih dari 7 metode belajar dan transformasi catatanmu menjadi alat belajar aktif.'

    Workspace:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: uuid-1234
        name:
          type: string
          example: Catatan Biologi
        method:
          type: string
          example: mind_map
        ai_status:
          type: string
          example: processing
        clean_text:
          type: string
          nullable: true
          example: "Fotosintesis adalah proses tumbuhan mengubah sinar matahari menjadi makanan..."
        nodes:
          type: array
          nullable: true
          items:
            type: object
        edges:
          type: array
          nullable: true
          items:
            type: object
        flashcards:
          type: array
          nullable: true
          items:
            type: object
        createdAt:
          type: string
          format: date-time
          example: 2026-05-14T09:08:59.000000Z
        updatedAt:
          type: string
          format: date-time
          example: 2026-05-14T09:09:47.000000Z

security:
  - sanctumAuth: []

paths:
  /auth/register:
    post:
      tags:
        - Auth
      summary: Register a new user
      description: Create a new user account and return access token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
                - password
                - password_confirmation
              properties:
                name:
                  type: string
                  example: Faris Andi
                email:
                  type: string
                  format: email
                  example: faris@example.com
                password:
                  type: string
                  format: password
                  example: secret123
                password_confirmation:
                  type: string
                  format: password
                  example: secret123
      responses:
        '201':
          description: User successfully registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
                message: Registrasi berhasil
                data:
                  token: 1|sanctum_token
                  user:
                    id: 1
                    name: Faris Andi
                    email: faris@example.com
                    role: user
                    created_at: '2026-07-02T03:00:00.000000Z'
                    updated_at: '2026-07-02T03:00:00.000000Z'
                errors: null
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/login:
    post:
      tags:
        - Auth
      summary: Login (User / Admin)
      description: >
        Autentikasi pengguna dan kembalikan Sanctum Bearer Token.
        Field **role** pada object `user` di response menentukan level akses:
        - `role: "user"` — pengguna biasa, tidak bisa akses endpoint `/admin/*`.
        - `role: "admin"` — administrator, bisa akses semua endpoint CMS Admin.

        Salin **token** dari response, lalu klik tombol **Authorize** di atas
        dan paste token tersebut untuk mengakses endpoint yang memerlukan autentikasi.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
            examples:
              LoginSebagaiUser:
                summary: "Login sebagai User biasa"
                value:
                  email: user@example.com
                  password: password123
              LoginSebagaiAdmin:
                summary: "Login sebagai Admin"
                description: >-
                  Gunakan kredensial ini untuk mendapatkan token admin.
                  Token admin diperlukan untuk mengakses endpoint CMS Admin.
                value:
                  email: admin@example.com
                  password: password123
      responses:
        '200':
          description: Successfully authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              examples:
                ResponseUserBiasa:
                  summary: "Response login sebagai User biasa (role: user)"
                  value:
                    success: true
                    message: Login berhasil
                    data:
                      token: 1|user_sanctum_token_example
                      user:
                        id: 2
                        name: User Biasa
                        email: user@example.com
                        role: user
                        created_at: '2026-07-02T03:00:00.000000Z'
                        updated_at: '2026-07-02T03:00:00.000000Z'
                    errors: null
                ResponseAdmin:
                  summary: "Response login sebagai Admin (role: admin)"
                  description: >-
                    Token ini yang perlu di-copy ke Authorize untuk test endpoint CMS Admin.
                  value:
                    success: true
                    message: Login berhasil
                    data:
                      token: 2|admin_sanctum_token_example
                      user:
                        id: 1
                        name: Admin Dicatatin
                        email: admin@example.com
                        role: admin
                        created_at: '2026-07-02T03:00:00.000000Z'
                        updated_at: '2026-07-02T03:00:00.000000Z'
                    errors: null
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: Email atau password salah.
                data: null
                errors:
                  credentials:
                    - Email atau password salah.

  /auth/logout:
    post:
      tags:
        - Auth
      summary: Logout user
      description: Revoke current access token.
      responses:
        '200':
          description: Successfully logged out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
                message: Logout berhasil
                data: null
                errors: null
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /workspaces:
    get:
      tags:
        - Workspaces
      summary: Get All Workspaces
      description: Mengambil seluruh workspace milik user.
      responses:
        '200':
          description: Berhasil mengambil data
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Workspace'
                  errors:
                    type: object
                    nullable: true
              example:
                success: true
                message: Data workspace berhasil diambil
                data:
                  - id: uuid-1234
                    name: Catatan Biologi
                    method: mind_map
                    ai_status: completed
                    clean_text: "Teks catatan biologi..."
                    nodes: []
                    edges: []
                    flashcards: []
                    createdAt: 2026-05-14T09:08:59.000000Z
                    updatedAt: 2026-05-14T09:09:47.000000Z
                errors: null

    post:
      tags:
        - Workspaces
      summary: Create New Workspace
      description: Upload gambar catatan untuk diproses AI secara background.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
                - method
              properties:
                file:
                  type: string
                  format: binary
                method:
                  type: string
                  example: mind_map
                name:
                  type: string
                  example: Untitled
      responses:
        '202':
          description: AI processing started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
                message: Gambar diterima, AI sedang memproses...
                data:
                  id: uuid-1234
                  ai_status: processing
                errors: null

  /workspaces/{id}:
    get:
      tags:
        - Workspaces
      summary: Get Workspace Detail
      description: Endpoint polling untuk mendapatkan hasil AI.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/Workspace'
                  errors:
                    type: object
                    nullable: true
              example:
                success: true
                message: Detail workspace diambil
                data:
                  id: 019e25bf-1189-73e6-9758-a74ef8195be1
                  name: Untitled
                  method: cornell
                  ai_status: processing
                  clean_text: null
                  nodes: null
                  edges: null
                  flashcards: null
                  createdAt: 2026-05-14T09:08:59.000000Z
                  updatedAt: 2026-05-14T09:09:47.000000Z
                errors: null

    put:
      tags:
        - Workspaces
      summary: Update Workspace
      description: Auto-save perubahan workspace.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                nodes:
                  type: array
                  items:
                    type: object
                edges:
                  type: array
                  items:
                    type: object
                flashcards:
                  type: array
                  items:
                    type: object
      responses:
        '200':
          description: Workspace berhasil disimpan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
                message: Workspace berhasil disimpan
                data:
                  updatedAt: 2026-05-14T21:00:00.000000Z
                errors: null

    delete:
      tags:
        - Workspaces
      summary: Delete Workspace
      description: Menghapus workspace beserta seluruh datanya secara permanen.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Workspace berhasil dihapus
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
                message: Workspace berhasil dihapus
                data: null
                errors: null

  /workspaces/{id}/transform:
    post:
      tags:
        - Workspaces
      summary: Transform Workspace Method
      description: Mengubah metode catatan dan memproses ulang AI.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - new_method
              properties:
                new_method:
                  type: string
                  example: cornell
      responses:
        '202':
          description: Transform processing started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
                message: Transformasi sedang diproses...
                data:
                  id: uuid-1234
                  ai_status: processing
                errors: null

  /workspaces/{id}/flashcards:
    post:
      tags:
        - Workspaces
      summary: Regenerate Flashcards
      description: >
        Meminta AI untuk membuat ulang set flashcard berdasarkan teks yang sudah
        diekstrak tanpa mengubah mind map atau catatan utamanya.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '202':
          description: Regenerasi diproses
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
                message: Permintaan regenerasi flashcard sedang diproses AI...
                data:
                  id: uuid-1234
                  ai_status: processing
                errors: null

  # -----------------------------------------------------------------------------
  # LANDING PAGE (Public)
  # -----------------------------------------------------------------------------

  /landing/hero:

    get:
      tags:
        - Landing (Public)

      summary: Get Hero Section Content

      description: >
        Mengambil konten teks aktif Hero Section untuk ditampilkan di Landing Page.
        Endpoint ini bersifat publik dan tidak memerlukan autentikasi.
        Jika belum ada data di database, sistem akan otomatis membuat record dengan
        nilai default (auto-seed via firstOrCreate).

      security: []

      responses:

        '200':
          description: Hero section content berhasil diambil

          content:
            application/json:

              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/HeroSectionContent'
                  errors:
                    type: object
                    nullable: true

              example:
                success: true
                message: Hero section content retrieved successfully
                data:
                  title_prefix: 'Ubah Catatan Berantakan Menjadi '
                  title_highlight: Pengetahuan Terstruktur
                  title_suffix: ' dalam Hitungan Detik'
                  subtitle: 'Platform AI yang memahami tulisan tanganmu. Pilih dari 7 metode belajar dan transformasi catatanmu menjadi alat belajar aktif.'
                errors: null

  # -----------------------------------------------------------------------------
  # CMS ADMIN � Hero Section
  # -----------------------------------------------------------------------------

  /admin/landing/hero:

    put:
      tags:
        - CMS Admin

      summary: Update Hero Section Content

      description: >
        Memperbarui konten teks Hero Section di Landing Page.
        Memerlukan Bearer Token dari akun dengan role **admin**.
        Jika token valid tapi role bukan admin, akan mengembalikan 403 Forbidden.

      requestBody:
        required: true

        content:
          application/json:

            schema:
              type: object

              required:
                - title_prefix
                - title_highlight
                - title_suffix
                - subtitle

              properties:

                title_prefix:
                  type: string
                  maxLength: 255
                  example: 'Ubah Catatan Berantakan Menjadi '

                title_highlight:
                  type: string
                  maxLength: 255
                  example: Catatan Pintar AI

                title_suffix:
                  type: string
                  maxLength: 255
                  example: ' dalam Hitungan Detik'

                subtitle:
                  type: string
                  example: 'Platform AI yang memahami tulisan tanganmu.'

      responses:

        '200':
          description: Hero section berhasil diperbarui

          content:
            application/json:

              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/HeroSectionContent'
                  errors:
                    type: object
                    nullable: true

              example:
                success: true
                message: Hero section content updated successfully
                data:
                  title_prefix: 'Ubah Catatan Berantakan Menjadi '
                  title_highlight: Catatan Pintar AI
                  title_suffix: ' dalam Hitungan Detik'
                  subtitle: 'Platform AI yang memahami tulisan tanganmu.'
                errors: null

        '401':
          description: Unauthenticated � Token tidak ditemukan atau tidak valid

          content:
            application/json:

              schema:
                $ref: '#/components/schemas/ErrorResponse'

              example:
                success: false
                message: Unauthenticated. Please provide a valid Bearer token.
                data: null
                errors:
                  auth:
                    - Token tidak ditemukan atau tidak valid.

        '403':
          description: Forbidden � Role bukan admin

          content:
            application/json:

              schema:
                $ref: '#/components/schemas/ErrorResponse'

              example:
                success: false
                message: Forbidden. Anda tidak memiliki akses sebagai admin.
                data: null
                errors:
                  auth:
                    - Akses ditolak. Role admin diperlukan.

        '422':
          description: Validation error

          content:
            application/json:

              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/landing/hero/reset:

    post:
      tags:
        - CMS Admin

      summary: Reset Hero Section Content to Default

      description: >
        Mengembalikan konten teks Hero Section ke nilai bawaan sistem (default).
        Memerlukan Bearer Token dari akun dengan role **admin**.
        Tidak memerlukan request body � reset langsung dilakukan ke nilai default
        yang sudah ditentukan di sistem (method defaults() pada model HeroSectionContent).

      responses:

        '200':
          description: Hero section berhasil direset ke nilai default

          content:
            application/json:

              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/HeroSectionContent'
                  errors:
                    type: object
                    nullable: true

              example:
                success: true
                message: Hero section content has been reset to default successfully
                data:
                  title_prefix: 'Ubah Catatan Berantakan Menjadi '
                  title_highlight: Pengetahuan Terstruktur
                  title_suffix: ' dalam Hitungan Detik'
                  subtitle: 'Platform AI yang memahami tulisan tanganmu. Pilih dari 7 metode belajar dan transformasi catatanmu menjadi alat belajar aktif.'
                errors: null

        '401':
          description: Unauthenticated � Token tidak ditemukan atau tidak valid

          content:
            application/json:

              schema:
                $ref: '#/components/schemas/ErrorResponse'

              example:
                success: false
                message: Unauthenticated. Please provide a valid Bearer token.
                data: null
                errors:
                  auth:
                    - Token tidak ditemukan atau tidak valid.

        '403':
          description: Forbidden � Role bukan admin

          content:
            application/json:

              schema:
                $ref: '#/components/schemas/ErrorResponse'

              example:
                success: false
                message: Forbidden. Anda tidak memiliki akses sebagai admin.
                data: null
                errors:
                  auth:
                    - Akses ditolak. Role admin diperlukan.